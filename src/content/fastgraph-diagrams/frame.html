<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · FastGraph</title>
<style>
@font-face{font-family:'Barlow Condensed';src:url('/fonts/BarlowCondensed-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('/fonts/JetBrainsMono-Regular.woff2') format('woff2');font-display:swap}
:root{color-scheme:light;--paper:#faf9f6;--ink:#242924;--muted:#70766e;--line:#d9ddd5;--accent:#b75430;--green:#286c59;--ease-out:cubic-bezier(.23,1,.32,1)}
:root[data-theme=dark]{color-scheme:dark;--paper:#20231f;--ink:#f0f2e9;--muted:#aeb7a7;--line:#475043;--accent:#e9a481;--green:#9bc7ac}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1000px;padding:30px 32px 22px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font:10px/1.5 'JetBrains Mono',monospace;letter-spacing:1.7px;color:var(--muted);text-transform:uppercase;margin:0 0 7px}h1{font:500 38px/1.02 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:-.6px;margin:0}p{margin:0}.intro{max-width:53ch;color:var(--muted);font-size:13px;line-height:1.65;margin-top:12px}button{flex:none;width:42px;height:42px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:50%;color:var(--ink);cursor:pointer;transition:background-color 160ms var(--ease-out),border-color 160ms var(--ease-out)}button svg{width:16px;height:16px}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}@media(hover:hover) and (pointer:fine){button:hover{background:var(--line);border-color:var(--muted)}}#drawing{margin-top:28px;min-width:0}#drawing>svg{display:block;width:100%;height:auto;overflow:visible}.caption{border-top:1px solid var(--line);padding-top:17px;margin-top:4px;position:relative}#progress{position:absolute;top:-1px;left:0;right:0;height:1px;background:var(--green);transform-origin:left;transform:scaleX(0)}#explanation{font-size:14px;line-height:1.65;min-height:47px;max-width:64ch}.footnote{display:flex;justify-content:space-between;gap:18px;margin-top:16px;font-size:10px;color:var(--muted);line-height:1.65}.footnote a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);white-space:nowrap}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:560px){main{padding:24px 20px 18px}h1{font-size:32px}.eyebrow{font-size:9px;letter-spacing:1.2px}#drawing{margin-top:20px}.intro{font-size:12px}.footnote{display:block}.footnote a{display:inline-block;margin-top:7px}#explanation{min-height:68px;font-size:13px}header{gap:10px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
@media print{button,#progress{display:none}main{break-inside:avoid}}
</style></head><body><main>
<header><div><p class="eyebrow">__LABEL__</p><h1>__TITLE__</h1></div><button id="play" type="button" aria-label="Play animation" title="Play animation"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3L13 8L5 13Z" fill="currentColor"/></svg></button></header>
<p class="intro">__INTRO__</p>
<div id="drawing">__POSTER__</div>
<p class="sr-only">__DESCRIPTION__</p>
<div class="caption"><div id="progress" aria-hidden="true"></div><p id="explanation">__EXPLANATION__</p></div>
<div class="footnote"><p>__SCOPE__</p><a href="__SOURCE__" target="_blank" rel="noopener noreferrer">View implementation ↗</a></div>
</main><script>
__SCENE__
const kind='__KIND__';
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),appearance=matchMedia('(prefers-color-scheme: dark)');
const playback=createPlayback(reduced.matches);
const drawing=document.getElementById('drawing'),button=document.getElementById('play'),description=document.getElementById('explanation');
let width=0,theme='light',nodes=new Map(),raf=null,last=null,printing=false;
function paint(){
  const time=printing?posterTime:playback.time;
  for(const [id,attrs] of Object.entries(frame(kind,time,width,theme))){
    const node=nodes.get(id);if(!node)continue;
    for(const [key,value] of Object.entries(attrs)){
      if(key==='text'){if(node.textContent!==value)node.textContent=value;}
      else if(node.getAttribute(key)!==String(value))node.setAttribute(key,value);
    }
  }
  const copy=caption(kind,time);if(description.textContent!==copy)description.textContent=copy;
  document.getElementById('progress').style.transform=`scaleX(${time/duration})`;
}
function rebuild(){
  const next=Math.max(280,Math.floor(drawing.getBoundingClientRect().width));
  width=next;drawing.innerHTML=renderDiagram(kind,playback.time,theme,width);
  nodes=new Map([...drawing.querySelectorAll('[id]')].map(el=>[el.id,el]));paint();
}
function tick(now){raf=null;if(last!==null)playback.advance(now-last);last=now;paint();if(playback.playing&&!printing)raf=requestAnimationFrame(tick);}
function reconcile(){
  const playing=playback.playing&&!printing;
  button.setAttribute('aria-label',playback.paused?'Play animation':'Pause animation');
  button.title=playback.paused?'Play animation':'Pause animation';
  button.innerHTML=playback.paused?'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3L13 8L5 13Z" fill="currentColor"/></svg>':'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM10 3h3v10h-3z" fill="currentColor"/></svg>';
  if(!playing){if(raf!==null)cancelAnimationFrame(raf);raf=null;last=null;}
  else if(raf===null){last=null;raf=requestAnimationFrame(tick);}
  paint();
}
button.addEventListener('click',()=>{playback.toggle();reconcile();});
function syncTheme(){
  let dark=appearance.matches;
  try{if(parent!==window)dark=parent.document.documentElement.classList.contains('dark');}catch{}
  theme=dark?'dark':'light';document.documentElement.dataset.theme=theme;rebuild();
}
syncTheme();
appearance.addEventListener('change',syncTheme);
reduced.addEventListener('change',event=>{playback.reduce(event.matches);reconcile();});
try{if(parent!==window)new MutationObserver(syncTheme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']});}catch{}
new IntersectionObserver(entries=>{playback.visible=entries[0].isIntersecting;reconcile();},{threshold:0}).observe(document.querySelector('main'));
document.addEventListener('visibilitychange',()=>{playback.hidden=document.hidden;reconcile();});playback.hidden=document.hidden;
new ResizeObserver(()=>{
  if(Math.abs(drawing.getBoundingClientRect().width-width)>1)rebuild();
  try{if(frameElement){frameElement.style.minHeight='0px';frameElement.style.height=`${Math.ceil(document.querySelector('main').getBoundingClientRect().height)+2}px`;}}catch{}
}).observe(document.querySelector('main'));
window.addEventListener('beforeprint',()=>{printing=true;reconcile();});
window.addEventListener('afterprint',()=>{printing=false;reconcile();});
reconcile();
</script></body></html>
