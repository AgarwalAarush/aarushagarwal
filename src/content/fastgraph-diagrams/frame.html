<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastGraph mechanism</title>
<style>
:root {color-scheme:light;--bg:#fbfaf7;--ink:#292b29;--muted:#62665f;--line:#d7dbd3;--wash:#edf0e9;--accent:#aa481f;--teal:#126756}
:root[data-theme=dark] {color-scheme:dark;--bg:#202321;--ink:#edf0e9;--muted:#b5bdb2;--line:#465047;--wash:#2b312c;--accent:#f3ad82;--teal:#85d6bc}
* {box-sizing:border-box} body {margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Arial,Helvetica,sans-serif} main {padding:24px;max-width:1000px;margin:auto} h1 {font-size:20px;line-height:1.3;font-weight:500;margin:0 0 8px;letter-spacing:-.025em} p {margin:0} .intro {color:var(--muted);max-width:62ch} .steps {display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 8px} button {font:inherit;font-size:13px;min-height:40px;border:1px solid var(--line);padding:7px 12px;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer} button[aria-pressed=true] {background:var(--ink);color:var(--bg);border-color:var(--ink)} button:hover {border-color:var(--ink)} button:focus-visible,a:focus-visible {outline:2px solid var(--accent);outline-offset:3px} .panels {display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px} svg {width:100%;height:auto;display:block} .explanation {border-top:1px solid var(--line);padding-top:16px;margin-top:8px;min-height:64px} .scope {color:var(--muted);font-size:12px;margin-top:15px} a {color:inherit;text-underline-offset:3px} .metrics {padding:16px} dl {margin:0} dl div {padding:9px 0;border-bottom:1px solid var(--line)} dt {color:var(--muted);font-size:12px} dd {margin:2px 0 0;font-size:21px;font-variant-numeric:tabular-nums} .decision {color:var(--teal);margin-top:18px;font-size:15px} .legend {display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0} .key {display:inline-block;width:10px;height:10px;margin-right:5px;background:var(--teal);border-radius:50%} .key.shell {background:var(--accent);border-radius:0} .key.wait {background:var(--line)} .key.radius,.key.bound {width:17px;height:0;border-radius:0;background:none;border-top:2px solid var(--teal);vertical-align:middle} .key.bound {border-color:var(--accent);border-top-style:dashed}
@media(max-width:560px) {main {padding:18px 14px}.panels {grid-template-columns:1fr}.panels svg {max-width:380px;margin:auto}.metrics {padding:0 6px 10px}dl {display:grid;grid-template-columns:1fr 1fr;gap:12px}dd {font-size:19px}.steps {gap:5px}button {padding:7px 9px;font-size:12px}.explanation {min-height:0}}
@media print {.steps {display:none} main {break-inside:avoid}}
</style>
</head>
<body><main>
<h1 id="title">__TITLE__</h1>
<p class="intro" id="intro">__INTRO__</p>
<div class="steps" role="group" aria-label="Explore the mechanism">__BUTTONS__</div>
<div id="panels" class="panels">__POSTER__</div>
<div id="legend" class="legend">__LEGEND__</div>
<p id="explanation" class="explanation" aria-live="polite">__EXPLANATION__</p>
<p class="scope">__SCOPE__ · <a href="__SOURCE__" target="_blank" rel="noopener noreferrer">Implementation ↗</a></p>
</main>
<script>
__SCENE__
const kind='__KIND__';
let current=2;
const explanations = {
  pca: [
    'Start with the original feature vectors. The diamond marks query q; the orange point p is one possible neighbor. No dimensions have been removed.',
    'PCA finds an orthonormal direction along the cloud’s greatest variance. Each point keeps its identity and its original feature vector.',
    'Project onto that direction to build the bins. The q–p distance shrinks from 1.71 to 1.60, so it is useful as a lower bound. Candidate ranking still uses the original 1.71 distance.'
  ],
  binstepper: [
    'Scan the query’s own bin. There are only two retained points, including q, so the four-neighbor set is not full. The search must continue.',
    'Visit the eight bins on the next boundary without rescanning the center. Four neighbors are now retained, but the lower bound of 1.00 is below the current radius of 1.10. Keep searching.',
    'Visit the sixteen bins on the second boundary. The retained neighbors do not change. Now the conservative lower bound of 2.00 exceeds the radius of 1.10, so the remaining 24 bins cannot improve the answer.'
  ]
};
function metrics(step) {
  const state=binState(step);
  return `<div class="metrics"><dl><div><dt>New bins in this shell</dt><dd>${state.newBins}</dd></div><div><dt>Retained neighbors · K = 4</dt><dd>${state.best.length} / 4</dd></div><div><dt>Farthest retained distance</dt><dd>${state.filled?state.radius.toFixed(2):'Not full'}</dd></div><div><dt>Unvisited distance ≥</dt><dd>${state.bound.toFixed(2)}</dd></div></dl><p class="decision">${state.stop?'2.00 > 1.10 → stop':state.filled?'1.00 < 1.10 → continue':'Fill the neighbor set → continue'}</p></div>`;
}
function paint() {
  const theme=document.documentElement.dataset.theme==='dark'?'dark':'light';
  document.getElementById('panels').innerHTML=kind==='pca'?renderPca(current,theme).join(''):renderBins(current,theme)+metrics(current);
  document.getElementById('explanation').textContent=explanations[kind][current];
  document.querySelectorAll('button[data-step]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.step)===current)));
}
document.querySelectorAll('button[data-step]').forEach(button=>button.addEventListener('click',()=>{current=Number(button.dataset.step);paint();}));
// Same-origin embeds inherit the portfolio's appearance and size to their content.
// Standalone figures use the system preference; there is no second theme control.
const media=matchMedia('(prefers-color-scheme: dark)');
function syncTheme() {
  let dark=media.matches;
  try {if(window.parent!==window) dark=window.parent.document.documentElement.classList.contains('dark');} catch {}
  document.documentElement.dataset.theme=dark?'dark':'light';paint();
}
syncTheme();media.addEventListener('change',syncTheme);
try {if(window.parent!==window) new MutationObserver(syncTheme).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:['class']});} catch {}
new ResizeObserver(()=>{if(window.frameElement) {window.frameElement.style.minHeight='0px'; window.frameElement.style.height=`${Math.ceil(document.querySelector('main').getBoundingClientRect().height)+2}px`;} }).observe(document.querySelector('main'));
window.addEventListener('beforeprint',()=>{current=2;paint();});
</script></body></html>
